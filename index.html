<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한능검 오답노트 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f1;--panel:#fbfdfc;--fg:#18222e;--mute:#5d6b76;--line:#d3dcda;--ink:#1f3a5f;--ink-fg:#fff;--red:#b8382b;--ok:#22744b;--okbg:#e0f1e8;--ng:#a8321f;--ngbg:#f9e3de;--warn:#9a6a00;--warnbg:#f8ecc9;--serif:'Nanum Myeongjo','Noto Serif KR',serif;--sans:'Noto Sans KR',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--panel:#18212a;--fg:#e6ecef;--mute:#98a6b0;--line:#2b3742;--ink:#8db4ee;--ink-fg:#0d1620;--red:#ef7d6d;--ok:#6fd3a0;--okbg:#17332a;--ng:#ff9d8c;--ngbg:#3a1f1b;--warn:#f0c860;--warnbg:#3a3017;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--panel:#18212a;--fg:#e6ecef;--mute:#98a6b0;--line:#2b3742;--ink:#8db4ee;--ink-fg:#0d1620;--red:#ef7d6d;--ok:#6fd3a0;--okbg:#17332a;--ng:#ff9d8c;--ngbg:#3a1f1b;--warn:#f0c860;--warnbg:#3a3017;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans);margin:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font:800 26px/1.2 var(--serif);margin:0;color:var(--ink);text-wrap:balance}
h1 span{color:var(--red)}
.sub{color:var(--mute);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{flex:1;min-width:0;padding:10px 6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 14px var(--sans);cursor:pointer;border-radius:4px}
nav button[aria-selected=true]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
nav .badge{font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;margin-left:4px}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font:700 19px var(--serif);margin:0}
h3{font:700 15px var(--sans);margin:0}
.btn{padding:10px 16px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--ink-fg);font:700 14px var(--sans);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
select,textarea,input[type=text]{font:14px var(--sans);padding:9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%}
textarea{min-height:170px;resize:vertical}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.q-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.tag{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:0 7px;font-size:12px;color:var(--mute)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink)}
.q{font:700 18px/1.6 var(--serif);text-wrap:pretty}
.q .blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--red);text-align:center;color:var(--red)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;font:15px var(--sans);cursor:pointer;display:flex;gap:10px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice b{color:var(--mute);font-weight:500}
.choice.right{background:var(--okbg);border-color:var(--ok)}
.choice.wrong{background:var(--ngbg);border-color:var(--ng)}
.fb{padding:12px 14px;border-radius:4px;border-left:4px solid;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.ng{background:var(--ngbg);border-color:var(--ng)}
.fb p{margin:0}
.fb .why{font-size:14px}
.ai{background:var(--bg);border:1px dashed var(--line);border-radius:4px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.bar{display:grid;grid-template-columns:78px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:12px;background:var(--line);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%}
.card{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--bg);min-width:0}
.card .term{font:700 15px var(--serif);color:var(--ink)}
.card .meta{font-size:12px;color:var(--mute)}
.pill{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--warnbg);color:var(--warn)}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.big{font:800 44px var(--serif);color:var(--ink);line-height:1}
.hl{background:var(--warnbg);padding:0 2px}
.note{font-size:13px;color:var(--mute);margin:0}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}

.q .no{font-weight:800}
.q .pts{font:500 13px var(--sans);color:var(--mute)}
.box{border:1px solid var(--ink);background:var(--bg);padding:12px 14px;border-radius:2px;white-space:pre-line;font:500 15px/1.8 var(--serif)}
.box .blank{display:inline-block;min-width:3em;text-align:center;border-bottom:2px solid var(--red);color:var(--red);font-weight:700}
.choice.sel{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.choice.ro{cursor:default}
.choice em{margin-left:auto;font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap}
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.navgrid button,.navgrid .cell{padding:6px 0;font:500 12px var(--sans);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:3px;text-align:center}
.navgrid button{cursor:pointer}
.navgrid .done{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.navgrid .cur{outline:2px solid var(--red);outline-offset:1px}
.navgrid .flag{box-shadow:inset 0 -3px 0 var(--warn)}
.navgrid .cell.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.navgrid .cell.ng{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.timer{font:800 17px var(--serif);font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low{color:var(--red)}
.pill.ok{background:var(--okbg);color:var(--ok)}
details.rv>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.rv .meta{margin-left:auto}
.rvb{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.sech{margin:10px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--ink)}
.bar2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.btn.sm{padding:4px 10px;font-size:12px}
.fb .why.note{font-size:13px;color:var(--mute)}
@media (max-width:480px){.navgrid{grid-template-columns:repeat(8,1fr)}.bar{grid-template-columns:96px 1fr 64px}}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:16px;font:500 13px var(--sans);cursor:pointer}
.chip.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.song{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.stz{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:10px 14px}
.stz .sn{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.ln{font:700 17px/1.9 var(--serif);letter-spacing:.02em}
.nl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.nl.tl{list-style:none;padding-left:0}
.nl.tl b{display:inline-block;min-width:4.5em;color:var(--ink)}
table.nt{width:100%;border-collapse:collapse;font-size:14px}
table.nt th,table.nt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.nt thead th{background:var(--bg);color:var(--mute);font-weight:500}
table.nt tbody th{white-space:nowrap;color:var(--ink)}
</style>

<div class="wrap">
  <header>
    <h1>한능검 <span>오답노트</span> 퀴즈</h1>
    <div class="sub" id="topstat"></div>
  </header>
  <nav id="tabs" role="tablist">
    <button data-t="quiz" role="tab">시험·연습</button>
    <button data-t="wrong" role="tab">오답노트<span class="badge" id="wcount" hidden></span></button>
    <button data-t="weak" role="tab">약점 분석</button>
    <button data-t="note" role="tab">암기 노트</button>
    <button data-t="doc" role="tab">내 문서</button>
  </nav>
  <main id="view"></main>
</div>

<script src="bank.js"></script>
<script src="notes.js"></script>
<script>
/* ---------- 내장 지식 베이스 ----------
   형식: [시대, 용어, 설명(핵심어는 [[ ]]), 연도(선택)] */
const ERAS=['선사·고조선','삼국','남북국','고려','조선 전기','조선 후기','근대','일제강점기','현대'];
const BASE=[
['선사·고조선','구석기 시대','[[뗀석기]]를 사용하고 [[동굴·막집]]에 살며 이동 생활을 한 시기'],
['선사·고조선','신석기 시대','[[빗살무늬 토기]]를 만들고 [[농경]]이 시작되어 정착 생활을 한 시기'],
['선사·고조선','청동기 시대','[[고인돌]]이 만들어지고 [[계급]]이 발생했으며 [[비파형 동검]]을 사용한 시기'],
['선사·고조선','고조선','[[8조법]]을 두었고 [[위만]] 때 철기 문화를 바탕으로 성장하다 한 무제의 공격으로 멸망한 나라',-108],
['선사·고조선','부여','[[영고]]라는 제천 행사가 있었고 [[사출도]]라는 행정 구역을 둔 나라'],
['선사·고조선','고구려(초기)','[[서옥제]]와 [[제가 회의]]가 있었고 10월에 [[동맹]]을 열었던 나라'],
['선사·고조선','옥저','[[민며느리제]]와 [[가족 공동 무덤]]의 풍습이 있었던 나라'],
['선사·고조선','동예','[[무천]]이라는 제천 행사와 [[책화]]라는 풍습이 있었던 나라'],
['선사·고조선','삼한','[[소도]]라는 신성 지역이 있었고 제사장 [[천군]]이 있었던 나라'],
['삼국','고구려 소수림왕','[[불교]]를 수용하고 [[태학]]을 설립했으며 율령을 반포한 왕',372],
['삼국','광개토 대왕','[[영락]] 연호를 쓰고 신라에 침입한 왜를 격퇴했으며 영토를 크게 넓힌 고구려 왕',400],
['삼국','장수왕','[[평양]]으로 천도하고 백제 [[한성]]을 함락한 고구려 왕',427],
['삼국','백제 근초고왕','[[고구려 평양성]]을 공격해 고국원왕을 전사시키고 [[박사 고흥]]에게 서기를 편찬하게 한 왕',371],
['삼국','백제 성왕','[[사비]]로 천도하고 국호를 [[남부여]]로 바꾼 왕',538],
['삼국','신라 지증왕','국호를 [[신라]]로 정하고 [[우산국]]을 정복했으며 순장을 금지한 왕',512],
['삼국','신라 법흥왕','[[율령]]을 반포하고 [[불교]]를 공인했으며 [[금관가야]]를 병합한 왕',527],
['삼국','신라 진흥왕','[[화랑도]]를 국가 조직으로 정비하고 [[한강 유역]]을 차지해 순수비를 세운 왕',551],
['삼국','살수 대첩','[[을지문덕]]이 수나라 군대를 크게 물리친 전투',612],
['삼국','안시성 전투','[[양만춘]]이 당 태종의 군대를 막아낸 전투',645],
['삼국','백강 전투','[[백제 부흥군]]과 왜의 연합군이 나당 연합군에 패한 전투',663],
['남북국','통일 신라 신문왕','[[국학]]을 설립하고 [[녹읍]]을 폐지했으며 관료전을 지급한 왕',682],
['남북국','통일 신라 원성왕','[[독서삼품과]]를 실시해 관리를 선발한 왕',788],
['남북국','발해 무왕','[[장문휴]]를 보내 당의 산둥 반도를 공격하고 연호를 [[인안]]으로 정한 왕',732],
['남북국','발해 문왕','[[상경]]으로 천도하고 연호를 [[대흥]]으로 정했으며 당과 친선을 도모한 왕'],
['남북국','발해 선왕','[[해동성국]]이라 불릴 만큼 전성기를 이룬 왕'],
['남북국','후백제','[[견훤]]이 완산주에 도읍을 정하고 세운 나라',900],
['남북국','후고구려','[[궁예]]가 송악에서 세우고 국호를 마진, 태봉으로 바꾼 나라',901],
['고려','왕건','[[후삼국]]을 통일하고 [[훈요 10조]]를 남긴 고려의 건국자',918],
['고려','광종','[[노비안검법]]과 [[과거제]]를 실시하고 [[광덕·준풍]] 연호를 사용한 왕',956],
['고려','성종','[[최승로]]의 시무 28조를 받아들이고 12목에 지방관을 파견한 왕',983],
['고려','서희의 담판','[[거란(소손녕)]]의 1차 침입 때 외교로 [[강동 6주]]를 확보한 사건',993],
['고려','귀주 대첩','[[강감찬]]이 거란의 3차 침입군을 크게 물리친 전투',1019],
['고려','묘청의 난','[[서경 천도]]와 칭제 건원을 주장하다 김부식에게 진압된 사건',1135],
['고려','무신 정변','[[정중부]] 등이 일으켜 무신 정권이 시작된 사건',1170],
['고려','삼별초 항쟁','[[배중손]]을 중심으로 강화도, 진도, 제주도로 옮기며 몽골에 항쟁한 군대',1270],
['고려','공민왕','[[쌍성총관부]]를 공격해 철령 이북을 수복하고 [[정방]]을 폐지한 왕',1356],
['고려','직지심체요절','[[청주 흥덕사]]에서 간행된 현존 세계 최고(最古)의 금속 활자본',1377],
['조선 전기','태조 이성계','[[위화도 회군]] 후 조선을 건국하고 [[한양]]으로 천도한 왕',1392],
['조선 전기','태종','[[6조 직계제]]와 [[호패법]]을 실시하고 사병을 혁파한 왕'],
['조선 전기','세종','[[훈민정음]]을 창제하고 [[4군 6진]]을 개척했으며 집현전을 설치한 왕',1443],
['조선 전기','세조','[[직전법]]을 실시하고 [[6조 직계제]]를 부활시킨 왕'],
['조선 전기','성종','[[경국대전]]을 완성·반포하고 홍문관을 설치한 왕',1485],
['조선 전기','4대 사화','[[무오·갑자·기묘·을사]]의 순서로 사림이 화를 입은 사건'],
['조선 전기','임진왜란','[[한산도 대첩]], 진주 대첩, 행주 대첩이 있었고 훈련도감이 설치된 전쟁',1592],
['조선 전기','대동법','[[광해군]] 때 경기도에서 처음 시행되어 [[공납]]을 쌀로 통일한 제도',1608],
['조선 후기','병자호란','[[남한산성]]에서 항전하다 삼전도에서 청에 항복한 전쟁',1636],
['조선 후기','영조','[[탕평비]]를 세우고 [[균역법]]을 시행했으며 청계천을 준설한 왕',1750],
['조선 후기','정조','[[규장각]]과 [[장용영]]을 설치하고 수원 화성을 건설한 왕',1796],
['조선 후기','세도 정치','[[순조·헌종·철종]] 때 안동 김씨 등 외척 가문이 권력을 독점한 정치 형태'],
['조선 후기','홍경래의 난','[[서북민(평안도)]] 차별에 반발해 일어난 대규모 농민 봉기',1811],

/* 한능검 형식 문제 은행(bank.js)을 항목으로 변환: 대상 → stm(서술문), 사건 → year */
const hash=x=>Math.abs([...x].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)).toString(36);
const BANKF=[],EVF=[];
BANK.forEach(([era,kind,grp,list])=>list.forEach(([name,st])=>BANKF.push({
  id:'s_'+hash(era+name),era,term:name,desc:st.map(x=>'[['+x+']]').join(', '),year:null,group:grp,list:true,src:'bank',kind,stm:st})));
EVENTS.forEach(([era,y,t])=>EVF.push({id:'e_'+hash(t),era,term:t,desc:'',year:y,group:'연표',src:'bank',ev:true}));
const FIXED=BASE.concat(MATS,BANKF,EVF);
const facts=()=>FIXED.concat(S.docs);
let IDX=new Map();
const reindex=()=>{IDX=new Map(facts().map(f=>[f.id,f]))};
const F=id=>IDX.get(id);
reindex();
const HAS_AI=!!(window.claude&&claude.use);
const rnd=n=>Math.floor(Math.random()*n);
const pick1=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>s.replace(/\[\[|\]\]/g,'');
const kws=f=>[...f.desc.matchAll(/\[\[(.+?)\]\]/g)].map(m=>m[1]);
const yr=y=>y<0?'기원전 '+(-y):String(y);
const eraList=()=>ERAS.concat(S.docs.length?['내 문서']:[]);
const sec=f=>{const g=f.group;return f.era+' › '+(!g||g===f.era||g==='조선'||g==='고려'?'일반':g)};
const secName=k=>k.split(' › ')[1];
/* 같은 대상을 가리키는 용어("고려 성종"/"성종", "천주교(후기)"/"천주교")를 같은 것으로 본다 */
const nterm=f=>f.term.replace(/\(.*?\)/g,'').replace(/\s+/g,'').replace(/^(고구려|백제|신라|통일신라|발해|고려|조선|근대|일제강점기|현대)/,'');
const shortKw=w=>w.length>16&&w.includes('(')?w.replace(/\s*\(.*$/,''):w;
const kwText=w=>w.length>30?shortKw(w):w;
const okKw=w=>{const s=shortKw(w);return s.length>=2&&s.length<=30};
const shares=(a,b)=>{const k=new Set(kws(b).map(shortKw));return kws(a).some(w=>k.has(shortKw(w)))};

/* ---------- 문제 생성 (한능검 형식: 5지 선다, 배점 1~3점) ----------

function sameEra(f,pool){ // 헷갈리기 쉬운 순서: 같은 섹션 → 같은 시대 → 다른 시대

const ch=(f,w,extra)=>Object.assign({t:kwText(w),fid:f.id,term:f.term,era:f.era},extra||{});

/* ===== 한능검 형식 (자료 제시 → 대상 추론 → 서술문 선지) ===== */

/* 같은 종류의 다른 대상: 같은 묶음 → 가까운 시대 순 (왕은 왕끼리, 인물은 인물끼리 헷갈리게) */
function peerFacts(f){
  const all=BANKF.filter(x=>x.id!==f.id&&x.kind===f.kind),ei=ERAS.indexOf(f.era);

/* 범위 + 유형 → 실제로 출제할 항목과 유형 */
function planSet(sf,kind){
  if(kind==='drill')return{sf,kinds:MIXD,note:''};
  if(!(kind==='mix'||NEWK.includes(kind)))return{sf,kinds:[kind],note:''};
  const kinds=kind==='mix'?MIXN:[kind];
  const ok=f=>f.src==='bank'&&(kind==='mix'||(kind==='between'||kind==='order'||kind==='timeline'?f.ev:f.stm));
  let b=sf.filter(ok),note='';
  if(b.length<3){
    const eras=new Set(sf.map(f=>f.era));
    b=BANKF.concat(EVF).filter(f=>eras.has(f.era)&&ok(f));
    note='이 범위에는 한능검형 자료가 부족해 같은 시대의 문제로 구성했습니다.';
  }
  if(b.length<3)return{sf,kinds:MIXD,note:'한능검형 문제를 만들 수 없어 단어 복습 문제로 구성했습니다.'};
  return{sf:b,kinds,note};
}
function factWeight(f){
  const s=S.stats[f.id]||{c:0,w:0};
  let w=Math.max(1,1+3*s.w-s.c);
  if(s.c+s.w===0)w+=2;
  const k=kws(f);
  if(k.length&&k.every(x=>uses(f,x)>0))w*=.5;     // 키워드를 모두 한 번씩 본 항목은 뒤로
  if(S.wrong[f.id])w*=2;
  if(S.recent.includes(f.id))w*=.1;                // 방금 나온 항목은 잠시 쉬게
  return w;
}
function weightedPick(arr,n){
  const out=[],a=arr.slice(),w=a.map(factWeight);
  while(out.length<n&&a.length){
    const tot=w.reduce((s,x)=>s+x,0);let r=Math.random()*tot,i=0;
    for(;i<a.length;i++){r-=w[i];if(r<=0)break}
    i=Math.min(i,a.length-1);out.push(a[i]);a.splice(i,1);w.splice(i,1);
  }
  return out;
}
function tryMake(f,pool,kinds,sigs){
  for(const strict of [true,false])
    for(const k of shuffle(kinds)){
      const q=MAKERS[k](f,pool);
      if(q&&!sigs.has(q.sig)&&(!strict||!S.sig[q.sig]))return q;
    }
  return null;
}
function buildSet(sf,pool,n,kinds){
  const out=[],sigs=new Set(),usedF=new Set();
  for(let pass=0;pass<3&&out.length<n;pass++){
    for(const f of weightedPick(sf.filter(f=>pass>0||!usedF.has(f.id)),Math.min(sf.length,(n-out.length)*3))){
      if(out.length>=n)break;
      const q=tryMake(f,pool,kinds,sigs);
      if(q){accept(q);sigs.add(q.sig);usedF.add(f.id);out.push(q)}
    }
  }
  return out;
}
/* 실제 시험처럼 선사→현대 순서, 시대별 문항 수, 배점(1점 12 · 2점 26 · 3점 12 = 100점) */
const EXAM_ERAS=[['선사·고조선',5],['삼국',6],['남북국',5],['고려',7],['조선 전기',6],['조선 후기',6],['근대',6],['일제강점기',5],['현대',4]];
function buildExam(){
  const all=facts(),sigs=new Set(),usedF=new Set(),out=[];
  const cls=shuffle([...Array(12).fill(1),...Array(26).fill(2),...Array(12).fill(3)]);
  const KC={1:['who'],2:['subj','subj','subj','between'],3:['neg','neg','order','timeline']};
  let si=0;
  for(const [era,n] of EXAM_ERAS)for(let j=0;j<n;j++){
    const c=cls[si++];let q=null;
    const bank=all.filter(f=>f.src==='bank');
    const pools=[bank.filter(f=>f.era===era&&!usedF.has(f.id)),bank.filter(f=>!usedF.has(f.id))];
    for(const pool of pools){
      for(const cc of [c,...[2,1,3].filter(x=>x!==c)]){
        for(const f of weightedPick(pool,10)){q=tryMake(f,all,KC[cc],sigs);if(q)break}
        if(q)break;
      }
      if(q)break;
    }
    if(!q)for(const f of weightedPick(all.filter(f=>f.era===era&&!usedF.has(f.id)),10)){q=tryMake(f,all,['true','fill','ident'],sigs);if(q)break}
    if(q){accept(q);sigs.add(q.sig);usedF.add(q.fid);out.push(q)}
  }
  return out;
}

/* ---------- 집계: 섹션·시대·원인 ---------- */
function secStats(){
  const m={};
  facts().forEach(f=>{
    const k=sec(f),e=m[k]||(m[k]={key:k,era:f.era,name:secName(k),c:0,w:0,facts:0,ow:0});
    const s=S.stats[f.id];e.facts++;if(s){e.c+=s.c;e.w+=s.w}if(S.wrong[f.id])e.ow++;
  });
  return Object.values(m).map(e=>Object.assign(e,{n:e.c+e.w,acc:e.c+e.w?e.c/(e.c+e.w):null}));
}
function weakSecs(){
  return secStats().filter(e=>(e.n>=3&&e.acc<.7)||(e.n>=2&&e.w>=2&&e.acc<.8)).sort((a,b)=>a.acc-b.acc||b.w-a.w);
}
function eraStats(){
  return eraList().map(e=>{let c=0,w=0;facts().filter(f=>f.era===e).forEach(f=>{const s=S.stats[f.id];if(s){c+=s.c;w+=s.w}});return{era:e,c,w,n:c+w,acc:c+w?c/(c+w):null}});
}
const CAUSE_TIP={
  '시대 혼동':'다른 시대의 사건·인물을 골랐습니다. 시대별 연표(순서)를 먼저 잡고, 시대마다 대표 키워드를 묶어 외우세요.',
  '같은 시대 인물·사건 혼동':'같은 시대 안에서 비슷한 항목을 헷갈렸습니다. 왕·인물별로 "이 사람만의 업적 1~2개"를 짝지어 비교표로 정리하세요.',
  '연대·순서 혼동':'사건의 선후 관계를 놓쳤습니다. 큰 사건 5~6개를 뼈대로 세우고 그 앞뒤에 나머지를 끼워 넣어 보세요.',
  '부정형 문제 실수':'"옳지 않은 것"을 묻는 문제에서 옳은 설명을 골랐습니다. 발문에 밑줄을 치고 선지를 ○/× 로 하나씩 판정하세요.',
  '미응답':'답을 고르지 못한 문항입니다. 모르더라도 소거법으로 하나는 선택하는 연습을 하세요.'};
function causeOf(q,a){
  if(a===null||a===undefined)return '미응답';
  if(q.type==='false'||q.type==='neg')return '부정형 문제 실수';
  if(['order','period','between','timeline'].includes(q.type))return '연대·순서 혼동';
  const c=q.choices[a];
  return c.era&&c.era!==q.era?'시대 혼동':'같은 시대 인물·사건 혼동';
}
function whyWrong(q,a){
  if(a===null||a===undefined)return '답을 선택하지 않았습니다.';
  const c=q.choices[a],f=F(q.fid);
  switch(q.type){
    case 'ident':{const o=F(c.fid);return `선택한 <b>${esc(c.t)}</b>은(는) ${o?esc(descText(o)):''} 와(과) 관련된 항목입니다.`}
    case 'true':case 'fill':return `선택한 "<b>${esc(c.t)}</b>"은(는) <b>${esc(c.term)}</b>(${esc(c.era)})에 해당하는 내용이라 이 문제의 답이 아닙니다.`;
    case 'subj':return `선택한 "<b>${esc(c.t)}</b>"은(는) <b>${esc(c.term)}</b>(${esc(c.era)})에 대한 설명입니다. 자료에서 (가)가 <b>${f?esc(f.term):''}</b>임을 먼저 찾아야 합니다.`;
    case 'who':{const o=F(c.fid);return `선택한 <b>${esc(c.t)}</b>은(는) ${o?esc(descText(o)):''} 와(과) 관련된 대상입니다.`}
    case 'between':return `선택한 <b>${esc(c.t)}</b>은(는) ${c.year!=null?yr(c.year)+'년경의 일로 ':''}(가) 시기 밖에 있습니다.`;
    case 'timeline':return `선택한 ${esc(c.t)} 칸은 연표상 맞지 않습니다. 정답은 ${esc(q.choices[q.answer].t)}입니다.`;
    case 'neg':case 'false':return `선택한 "<b>${esc(c.t)}</b>"은(는) ${f?esc(f.term):'이 항목'}에 대한 <b>옳은</b> 설명입니다. 이 문제는 옳지 <b>않은</b> 것을 고르는 문제였습니다.`;
    case 'period':return `선택한 <b>${esc(c.t)}</b>은(는) ${c.year!=null?yr(c.year)+'년경의 사건으로 ':''}(가) 시기 밖에 있습니다.`;
    case 'order':return `선택한 순서(${esc(c.t)})는 연대와 맞지 않습니다. 정답은 ${esc(q.choices[q.answer].t)} 입니다.`;
  }
  return '';
}
function descText(f,n=4){
  if(!f.desc)return '';
  if(!f.list)return plain(f.desc);
  const k=kws(f);return (k.length>n?k.slice(0,n):k).join(', ');
}

/* ---------- 기록 ---------- */
function record(q,a,mode){
  const ok=a===q.answer,st=S.stats[q.fid]||(S.stats[q.fid]={c:0,w:0});
  if(ok){
    st.c++;
    const w=S.wrong[q.fid];
    if(w){w.streak=(w.streak||0)+1;if(w.streak>=2){delete S.wrong[q.fid];S.wlog.forEach(e=>{if(e.fid===q.fid)e.resolved=true})}}
  }else{
    st.w++;
    const prev=S.wrong[q.fid];
    S.wrong[q.fid]={era:q.era,at:Date.now(),streak:0,n:(prev?.n||0)+1};
    const e=Object.assign({},q,{id:Date.now().toString(36)+rnd(1e4),at:Date.now(),mode,picked:a,cause:causeOf(q,a),resolved:false});
    delete e.used;delete e.sig;
    S.wlog.unshift(e);if(S.wlog.length>400)S.wlog.length=400;
  }
  return ok;
}

/* ---------- 문서 → 사실(Fact) 자동 추출 ---------- */
function guessKeywords(desc){
  const found=new Set();
  (desc.match(/[「『"'“‘]([^」』"'”’]{2,12})[」』"'”’]/g)||[]).forEach(m=>found.add(m.slice(1,-1)));
  (desc.match(/\d{3,4}년|\d{1,2}세기/g)||[]).forEach(m=>found.add(m));
  (desc.match(/[가-힣]{2,6}(?:왕|제|법|전투|조약|운동|난|란|사건|정변|개혁|대첩|회의|협회|단체|군)/g)||[]).forEach(m=>found.add(m));
  return [...found].slice(0,3);
}
function parseDoc(text,era){
  const out=[];
  text.split(/\n+/).map(s=>s.trim()).filter(s=>s.length>6).forEach(line=>{
    let term,desc,m;
    if((m=line.match(/^[-•·*\d.)\s]*([^:：=\-–—]{1,20})\s*[:：=]\s*(.{6,})$/))||(m=line.match(/^[-•·*\d.)\s]*([^\-–—:：]{1,20})\s+[-–—]\s+(.{6,})$/))){term=m[1].trim();desc=m[2].trim()}
    else if((m=line.match(/^(.{2,18}?)(?:은|는|이|가)\s+(.{8,}?(?:이다|였다|했다|한다|된다|다)\.?)$/))){term=m[1].trim();desc=m[2].trim()}
    else return;
    let ks=guessKeywords(desc);
    let d=desc;ks.forEach(k=>{d=d.replace(k,'[['+k+']]')});
    if(!ks.length){const w=desc.split(/\s+/).filter(x=>x.length>=3).sort((a,b)=>b.length-a.length)[0];if(w)d=desc.replace(w,'[['+w.replace(/[.,]$/,'')+']]')}
    const ym=desc.match(/(?:기원전\s*)?(\d{3,4})년/);
    let year=ym?(+ym[1])*(/기원전/.test(ym[0])?-1:1):null;
    out.push({id:'u'+out.length+'_'+Math.abs([...term].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)),era,term,desc:d,year,src:'doc'});
  });
  return out;
}

/* ---------- 범위 ---------- */
function scopeFacts(sc){
  const all=facts();
  if(sc==='wrong'){const r=all.filter(f=>S.wrong[f.id]);return r.length?r:all}
  if(sc==='weak'){const ws=new Set(weakSecs().map(s=>s.key));const r=all.filter(f=>ws.has(sec(f))||S.wrong[f.id]);return r.length>=3?r:all}
  if(sc.startsWith('era:'))return all.filter(f=>f.era===sc.slice(4));
  if(sc.startsWith('sec:'))return all.filter(f=>sec(f)===sc.slice(4));
  if(sc.startsWith('fact:')){const f=F(sc.slice(5));return f?[f]:all}
  return all;
}
function startPractice(o){
  if(run&&run.kind==='exam'&&!run.done){notice='진행 중인 모의고사를 먼저 끝내 주세요.';tab='quiz';render();return true}
  const pool=facts(),plan=planSet(scopeFacts(o.scope),o.kind);
  const qs=buildSet(plan.sf,pool,o.n,plan.kinds);
  if(!qs.length)return false;
  run={kind:'practice',qs,ans:qs.map(()=>null),flag:[],i:0,start:Date.now(),limitMin:0,done:false,scope:o.scope,note:plan.note};
  notice='';save();tab='quiz';render();return true;
}
function startExam(limitMin){
  const qs=buildExam();
  if(qs.length<10)return false;
  run={kind:'exam',qs,ans:qs.map(()=>null),flag:[],i:0,start:Date.now(),limitMin,done:false};
  S.cur=run;notice='';save();tab='quiz';render();return true;
}

function remaining(){return run.limitMin?run.limitMin*60-Math.floor((Date.now()-run.start)/1000):null}

}

function finish(){
  const exam=run.kind==='exam';
  if(exam)run.qs.forEach((q,i)=>record(q,run.ans[i],'exam'));
  else{ // 연습: 푼 문제만 결과에 반영
    const keep=run.ans.map((a,i)=>a!==null?i:-1).filter(i=>i>=0);
    run.qs=keep.map(i=>run.qs[i]);run.ans=keep.map(i=>run.ans[i]);
  }
  let score=0,total=0;
  run.qs.forEach((q,i)=>{total+=q.pts;if(run.ans[i]===q.answer)score+=q.pts});
  const scaled=exam&&total!==100?Math.round(score*100/total):score;
  run.done=true;run.confirm=false;
  run.res={score:scaled,total:exam?100:total,right:run.qs.filter((q,i)=>run.ans[i]===q.answer).length,n:run.qs.length,
    sec:Math.round((Date.now()-run.start)/1000),grade:exam?gradeOf(scaled):''};
  if(exam)S.hist.push({at:Date.now(),kind:'exam',score:scaled,grade:run.res.grade,n:run.qs.length,sec:run.res.sec});
  else if(run.qs.length)S.hist.push({at:Date.now(),kind:'practice',score:pct(run.res.right,run.res.n),grade:'',n:run.qs.length,sec:run.res.sec});
  if(S.hist.length>60)S.hist=S.hist.slice(-60);
  S.cur=null;save();
}

  <div class="panel">
    <h2>약한 섹션</h2>
    ${!anyData?'<div class="empty">아직 푼 문제가 없습니다. 풀수록 약한 섹션이 여기에 분석됩니다.</div>':`
      ${weak.length?`<p><b>집중 필요:</b> ${weak.map(w=>`${esc(w.era)} › ${esc(w.name)} (${Math.round(100*w.acc)}%)`).join(' · ')}</p>
        <div class="row"><button class="btn" id="weakgo">약한 섹션 문제만 새로 풀기</button></div>`
        :'<p>정답률이 낮은 섹션은 아직 없습니다. 표본(3문항 이상)이 쌓이면 분석됩니다.</p>'}
      <h3>시대별</h3>
      ${eras.map(e=>e.n?barRow(e.era,e.c/e.n,`${Math.round(100*e.c/e.n)}% (${e.n})`):`<div class="bar"><span>${esc(e.era)}</span><div class="t"></div><span class="note">미응시</span></div>`).join('')}
      <h3>섹션별 (약한 순)</h3>
      ${tried.map(s=>`<div class="bar2">
          ${barRow(s.era+' › '+s.name,s.c/s.n,`${Math.round(100*s.acc)}% (${s.n})`)}
          <button class="btn ghost sm" data-sec="${esc(s.key)}">새 문제 풀기</button></div>`).join('')}
      ${untried.length?`<p class="note">아직 풀지 않은 섹션: ${untried.map(s=>esc(s.era+' › '+s.name)).join(', ')}</p>`:''}`}
  </div>
  ${Object.keys(causes).length?`<div class="panel"><h2>틀린 이유 분석 <span class="pill">미해결 오답 기준</span></h2>
    ${Object.entries(causes).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="card"><div class="row" style="justify-content:space-between"><span class="term">${esc(c)}</span><span class="meta">${n}건</span></div><div class="note">${esc(CAUSE_TIP[c]||'')}</div></div>`).join('')}</div>`:''}
  ${topFacts.length?`<div class="panel"><h2>자주 틀리는 항목 TOP</h2>
    ${topFacts.map(([id,s])=>{const f=F(id);return `<div class="card"><div class="row" style="justify-content:space-between"><span class="term">${esc(f.term)}</span><span class="meta">${esc(f.era)} · 오답 ${s.w} / 정답 ${s.c}</span></div><div class="note">${descHtml(f)}</div></div>`}).join('')}</div>`:''}
  ${exams.length?`<div class="panel"><h2>모의고사 점수 추이</h2>
    ${exams.map(h=>barRow(dfmt(h.at),h.score/100,`${h.score}점 ${esc(h.grade.slice(0,2))}`)).join('')}</div>`:''}
  <div class="panel" id="study">
    <h2>집중 학습</h2>
    <div class="grid">
      <label>학습할 시대<select id="se">${eraList().map(e=>`<option ${e===focus?'selected':''}>${esc(e)}</option>`).join('')}</select></label>
      <label>검색<input type="text" id="sq" placeholder="용어나 키워드 (예: 장수왕, 8조법)"></label>
    </div>
    <div id="cards"></div>
    <div class="row"><button class="btn" id="eq">이 시대 퀴즈 풀기</button>${HAS_AI?'<button class="btn ghost" id="ai">AI 요약 노트 받기</button>':''}</div>
    <div id="aisum"></div>
  </div>`;
  const $=id=>document.getElementById(id);
  if($('weakgo'))$('weakgo').onclick=()=>startPractice({scope:'weak',kind:'mix',n:10});
  $v.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>startPractice({scope:'sec:'+b.dataset.sec,kind:'mix',n:10}));
  const draw=()=>{
    const e=$('se').value,q=$('sq').value.trim();
    const fs=facts().filter(f=>f.era===e&&(!q||f.term.includes(q)||plain(f.desc).includes(q))).sort((a,b)=>(b.year!=null)-(a.year!=null)||(a.year??0)-(b.year??0));
    let cur='';
    $('cards').innerHTML=!fs.length?'<div class="empty">일치하는 항목이 없습니다.</div>':fs.map(f=>{
      const s=S.stats[f.id]||{c:0,w:0},h=f.group&&f.group!==cur&&!q?(cur=f.group,`<h3 class="sech">${esc(f.group)}</h3>`):'';
      return h+`<div class="card" style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><span class="term">${esc(f.term)}</span><span class="meta">${f.year!=null?yr(f.year)+'년 · ':''}${s.w?`오답 ${s.w}회`:s.c?'숙지':'미학습'}</span></div>
      <div>${descHtml(f)}</div></div>`}).join('');
  };
  draw();
  $('se').onchange=draw;$('sq').oninput=draw;
  $('eq').onclick=()=>startPractice({scope:'era:'+$('se').value,kind:'mix',n:10});
  if($('ai'))$('ai').onclick=async()=>{
    const out=$('aisum'),s=await getSample();
    if(!s){out.innerHTML='<div class="ai">이 화면에서는 AI 기능을 쓸 수 없습니다.</div>';return}
    const e=$('se').value;
    const wr=S.wlog.filter(w=>w.era===e&&!w.resolved).map(w=>w.stem.replace(/<[^>]+>/g,'')+' '+(w.box||'').replace(/<[^>]+>/g,'')).slice(0,6);
    const fs=facts().filter(f=>f.era===e).map(f=>f.term+': '+plain(f.desc)).join('\n').slice(0,12000);
    out.innerHTML='<div class="ai" id="aisumt">정리 중...</div>';
    try{await s(`한국사능력검정시험 '${e}' 범위의 요약 노트를 한국어로 작성하세요. 아래 자료를 기반으로 시험에 자주 나오는 구분 포인트, 헷갈리기 쉬운 쌍, 연상 암기법을 정리하고, 마지막에 확인 문제 3개(정답 포함)를 내세요. 마크다운 기호 없이 일반 텍스트로 쓰세요.\n\n[자료]\n${fs}\n\n[학생이 틀린 문제]\n${wr.join('\n')||'없음'}`,{onText:({text})=>{document.getElementById('aisumt').textContent=text}})}
    catch(err){document.getElementById('aisumt').textContent='불러오지 못했습니다.'}
  };
}

/* ---------- 암기 노트: 시대별 노래 · 핵심 정리 · 비교표 · 암기 요령 ---------- */
let NE=null,NMASK=false;
function vNote(){
  const eras=NOTES.eras,cur=eras.find(e=>e.era===NE)||eras[0];NE=cur.era;
  const done=S.noteDone||(S.noteDone={}),doneN=eras.filter(e=>done[e.era]).length;
  const mask=l=>{const w=l.split(' ');return w[0]+' '+w.slice(1).map(x=>'○'.repeat([...x].length)).join(' ')};
  const evs=EVENTS.filter(e=>e[0]===cur.era).sort((a,b)=>a[1]-b[1]);
  const table=([title,rows])=>`<div class="card"><h3>${esc(title)}</h3><table class="nt"><thead><tr>${rows[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<th scope="row">${esc(c)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  $v.innerHTML=`
  <div class="panel">
    <h2>암기 노트 <span class="pill">노래 외움 ${doneN}/${eras.length}</span></h2>
    <p class="note">시대를 고르면 그 시대의 노래 · 핵심 정리 · 헷갈리는 쌍 비교 · 암기 요령 · 연표가 한 화면에 나옵니다.</p>
    <div class="chips">${eras.map(e=>`<button class="chip ${e.era===cur.era?'on':''}" data-era="${esc(e.era)}">${done[e.era]?'✓ ':''}${esc(e.era)}</button>`).join('')}</div>
  </div>
  <div class="panel">
    <h2>${esc(cur.song.title)}</h2>
    <p class="note">멜로디: ${esc(NOTES.melody)} — 한 줄은 7글자, 한 연은 6줄입니다. 박자에 맞춰 또박또박 읽다가 멜로디를 얹어 보세요.</p>
    <div class="song">${cur.song.stanzas.map((st,i)=>`<div class="stz"><span class="sn">${i+1}절</span>${st.map(l=>`<div class="ln">${esc(NMASK?mask(l):l)}</div>`).join('')}</div>`).join('')}</div>
    <div class="row">
      <button class="btn ${NMASK?'':'ghost'}" id="mask">${NMASK?'가사 다시 보기':'가사 가리기 (첫 단어만 보이게)'}</button>
      <button class="btn ghost" id="done">${done[cur.era]?'외움 표시 해제':'이 시대 노래 외웠어요'}</button>
    </div>
  </div>
  <div class="panel">
    <h2>핵심 정리</h2>
    <ul class="nl">${cur.core.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
  </div>
  <div class="panel">
    <h2>헷갈리는 쌍 비교</h2>
    ${cur.pairs.map(table).join('')}
  </div>
  <div class="panel">
    <h2>암기 요령</h2>
    <ul class="nl">${cur.tips.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
  </div>
  <div class="panel">
    <h2>${esc(cur.era)} 연표</h2>
    ${evs.length?`<ul class="nl tl">${evs.map(e=>`<li><b>${yr(e[1])}</b> ${esc(e[2])}</li>`).join('')}</ul>`:'<p class="note">이 시대는 연표 사건이 아직 없습니다.</p>'}
    <div class="row"><button class="btn" id="nq">이 시대 한능검형 문제 풀기</button><button class="btn ghost" id="nw">오답노트 보기</button></div>
  </div>
  <div class="panel">
    <h2>노래로 외우는 법</h2>
    <ul class="nl">${NOTES.songTips.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
  </div>
  <div class="panel">
    <h2>암기하기 쉬운 방법 7가지</h2>
    ${NOTES.methods.map(([t,d])=>`<div class="card"><div class="term">${esc(t)}</div><div>${esc(d)}</div></div>`).join('')}
  </div>`;
  const $=id=>document.getElementById(id);
  $v.querySelectorAll('[data-era]').forEach(b=>b.onclick=()=>{NE=b.dataset.era;NMASK=false;vNote();window.scrollTo&&scrollTo(0,0)});
  $('mask').onclick=()=>{NMASK=!NMASK;vNote()};
  $('done').onclick=()=>{S.noteDone[cur.era]=!S.noteDone[cur.era];save();vNote()};
  $('nq').onclick=()=>startPractice({scope:'era:'+cur.era,kind:'mix',n:10});
  $('nw').onclick=()=>{WF.era=cur.era;WF.st='open';go('wrong')};
}

/* ---------- 내 문서 ---------- */
function vDoc(){
  $v.innerHTML=`<div class="panel">
    <h2>내 문서로 문제 만들기</h2>
    <p class="note">교재·요약본 내용을 붙여넣으면 한 줄씩 읽어 문제로 바꿉니다. 인식하는 형식: <b>용어: 설명</b> / <b>용어 - 설명</b> / <b>○○은(는) ~이다.</b> 같은 시대에 항목이 5개 이상 있어야 5지선다 보기가 만들어집니다. (data.txt 같은 자료 파일은 <b>build.py</b>로 내장하세요.)</p>
    <textarea id="txt" placeholder="예)&#10;세종: 훈민정음을 창제하고 4군 6진을 개척한 왕 (1443년)&#10;균역법 - 군포를 1년에 1필로 줄인 제도&#10;병자호란은 인조 때 청이 침입하여 삼전도에서 항복한 전쟁이다."></textarea>
    <div class="grid">
      <label>시대 분류<select id="de">${ERAS.map(e=>`<option>${e}</option>`).join('')}<option>내 문서</option></select></label>
    </div>
    <div class="row"><button class="btn" id="parse">규칙으로 문제 만들기</button>${HAS_AI?'<button class="btn ghost" id="aiparse">AI로 정밀 추출</button>':''}</div>
    <div id="docmsg"></div>
  </div>
  ${S.docs.length?`<div class="panel"><h2>등록된 내 문서 항목 <span class="pill">${S.docs.length}</span></h2>
    <div class="row"><button class="btn" id="dq">내 문서로 퀴즈 풀기</button><button class="btn ghost" id="dclear">전체 삭제</button></div>
    ${S.docs.slice(0,40).map(f=>`<div class="card"><span class="term">${esc(f.term)}</span> <span class="meta">${esc(f.era)}</span><div>${descHtml(f)}</div></div>`).join('')}
    ${S.docs.length>40?`<p class="note">외 ${S.docs.length-40}개</p>`:''}</div>`:''}`;
  const add=list=>{
    const have=new Set(S.docs.map(d=>d.term+'|'+d.desc));
    list=list.filter(x=>!have.has(x.term+'|'+x.desc));
    list.forEach((x,i)=>{x.id='u'+Date.now().toString(36)+i});
    S.docs=S.docs.concat(list);reindex();save();return list.length;
  };
  const $=id=>document.getElementById(id);
  $('parse').onclick=()=>{
    const r=parseDoc($('txt').value,$('de').value);
    if(!r.length){$('docmsg').innerHTML='<p class="fb ng">인식된 항목이 없습니다. "용어: 설명" 형태로 한 줄에 하나씩 적어 주세요.</p>';return}
    const n=add(r);render();$('docmsg').innerHTML=`<p class="fb ok">${n}개 항목을 추가했습니다.</p>`;
  };
  if($('aiparse'))$('aiparse').onclick=async()=>{
    const t=$('txt').value.trim(),m=$('docmsg'),s=await getSample();
    if(!t){m.innerHTML='<p class="fb ng">먼저 문서 내용을 붙여넣어 주세요.</p>';return}
    if(!s){m.innerHTML='<p class="fb ng">이 화면에서는 AI 추출을 쓸 수 없습니다.</p>';return}
    m.innerHTML='<div class="ai">문서를 분석하는 중...</div>';
    try{
      const arr=await s.json(`다음 한국사 학습 문서에서 시험에 나올 만한 모든 사실을 빠짐없이 추출하세요. JSON 배열만 출력하세요. 각 원소: {"era": "${ERAS.join('|')}" 중 하나, "term": 용어(인물/사건/제도 이름), "desc": 용어 이름을 포함하지 않는 한 문장 설명에서 핵심어 1~3개를 [[ ]]로 감싼 것, "year": 알면 정수(기원전은 음수) 모르면 null}.\n\n[문서]\n${t.slice(0,20000)}`,{});
      const list=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.term&&x.desc).map(x=>({era:ERAS.includes(x.era)?x.era:'내 문서',term:String(x.term),desc:String(x.desc),year:Number.isInteger(x.year)?x.year:null,src:'doc'}));
      const n=add(list);render();$('docmsg').innerHTML=`<p class="fb ok">AI가 ${n}개 항목을 추출했습니다.</p>`;
    }catch(e){m.innerHTML='<p class="fb ng">추출에 실패했습니다. 규칙 기반 생성을 시도해 보세요.</p>'}
  };
  if($('dq'))$('dq').onclick=()=>{window._preset={scope:'era:내 문서'};go('quiz')};
  if($('dclear'))$('dclear').onclick=()=>{$('dclear').textContent='정말 삭제하려면 한 번 더 누르세요';$('dclear').onclick=()=>{S.docs.forEach(f=>{delete S.stats[f.id];delete S.wrong[f.id]});S.docs=[];reindex();save();render()}};
}

render();
</script>
